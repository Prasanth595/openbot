name: Status page

# The public status page at https://status.openbot.run. GitHub hosts it, so it stays up when
# Cloudflare does not. Each run checks the services, keeps the check history in `state.json` on the
# `status-data` branch, opens or closes the automatic incident issues, and publishes the page with
# the `status` issues. See apps/status/scripts/update.ts.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Start a new check history. Only for the first run, when `status-data` does not exist.
        type: boolean
        default: false
  # A maintainer's change to an incident issue shows on the page without a wait for the schedule.
  # Anyone can start these events, so they only read the issues again: no probes, no run counts, no
  # issue writes, and no new history. Issues and comments that GITHUB_TOKEN writes start no run.
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  issue_comment:
    types: [created, edited, deleted]

permissions: {}

jobs:
  update:
    name: Check and publish
    if: >-
      github.repository == 'nightly-labs/openbot' && (
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch' ||
        contains(github.event.issue.labels.*.name, 'status') ||
        github.event.label.name == 'status'
      )
    # One check run at a time, because each check run replaces `status-data` with a new commit. A new
    # run waits; it does not stop the run that writes. Issue events use their own group, so a pending
    # issue event never replaces a pending check run. On the job, not the workflow: an issue event
    # that the `if` skips must not take a group.
    concurrency:
      group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'status-page' || 'status-page-issues' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
    env:
      CHECKS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: ignore-scripts

      # A missing branch stops the run, unless this is the bootstrap run: a network error must never
      # start an empty history. `ls-remote` exits with 2 when the branch does not exist.
      - name: Read the check history
        id: history
        shell: bash
        env:
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        run: |
          mkdir -p .status-data
          set +e
          git ls-remote --exit-code origin refs/heads/status-data > /dev/null
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            if [ "$BOOTSTRAP" = "true" ]; then
              echo "::error::status-data exists. Run without bootstrap."
              exit 1
            fi
            git fetch --depth=1 --no-tags origin refs/heads/status-data
            git show FETCH_HEAD:state.json > .status-data/state.json
            echo "lease=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ] && [ "$BOOTSTRAP" = "true" ]; then
            echo "lease=" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not read the status-data branch (git exit code $code). Run with bootstrap only for the first run."
            exit 1
          fi

      - name: Check the services
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
        shell: bash
        run: |
          flags=()
          if [ "$BOOTSTRAP" = "true" ]; then flags+=(--bootstrap); fi
          if [ "$CHECKS" != "true" ]; then flags+=(--incidents-only); fi
          bun apps/status/scripts/update.ts --state .status-data/state.json --out .status-site "${flags[@]}"

      # One parentless commit, so the branch does not grow with every run. The lease stops the push
      # when another writer changed the branch after this run read it.
      # Also after a failed check step: the state can hold an issue that the step opened.
      - name: Save the check history
        if: ${{ !cancelled() && env.CHECKS == 'true' && steps.history.outcome == 'success' && hashFiles('.status-data/state.json') != '' }}
        shell: bash
        env:
          LEASE: ${{ steps.history.outputs.lease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          blob=$(git hash-object -w .status-data/state.json)
          tree=$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree)
          commit=$(git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit-tree "$tree" -m "Status check history")
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push --force-with-lease="refs/heads/status-data:$LEASE" origin "$commit:refs/heads/status-data"

      # An issue event runs beside the check runs. When a check run saved new history after this run
      # read it, this run's check data is old, and the check run publishes the page.
      - name: Decide to publish
        id: publish
        shell: bash
        env:
          LEASE: ${{ steps.history.outputs.lease }}
        run: |
          publish=true
          if [ "$CHECKS" != "true" ]; then
            head=$(git ls-remote --exit-code origin refs/heads/status-data | cut -f1)
            if [ "$head" != "$LEASE" ]; then
              echo "::notice::A check run saved new history. That run publishes the page."
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      # The page changes only with apps/status, so most runs reuse the build.
      - name: Restore the page build
        if: steps.publish.outputs.publish == 'true'
        id: build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/status/dist
          key: status-page-${{ hashFiles('apps/status/**', 'packages/brand/**', 'apps/auth-api/public/favicon-32x32.png', 'apps/auth-api/public/apple-touch-icon.png', 'bun.lock') }}

      - name: Build the page
        if: steps.publish.outputs.publish == 'true' && steps.build-cache.outputs.cache-hit != 'true'
        run: bun run --cwd apps/status build

      - name: Add the status files
        if: steps.publish.outputs.publish == 'true'
        run: |
          cp -R apps/status/dist .status-pages
          cp .status-site/status.json .status-site/feed.xml .status-pages/

      - name: Upload the page
        if: steps.publish.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .status-pages

  deploy:
    name: Deploy
    needs: update
    if: needs.update.outputs.publish == 'true'
    concurrency:
      group: status-page-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
