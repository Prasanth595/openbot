# One OpenBot container of several on one host. `openbot-instance` runs it with the env file of the
# instance, so each instance has its own project, container, data and limits. See
# docs/docker.md#several-instances-on-one-host.
services:
  openbot:
    image: ghcr.io/nightly-labs/openbot:${OPENBOT_TAG:-latest}
    container_name: openbot-${OPENBOT_NAME:?}
    restart: unless-stopped
    security_opt:
      - seccomp=../seccomp.json
      - no-new-privileges:true
    shm_size: 1g
    stop_grace_period: 60s
    cpus: ${OPENBOT_CPUS:?}
    mem_limit: ${OPENBOT_MEM:?}
    # No swap above the memory limit.
    memswap_limit: ${OPENBOT_MEM:?}
    pids_limit: 8192
    # The container layer is on the disk of the host and has no size limit, so nothing can write to
    # it. OpenBot and agents write to /data and to these tmpfs folders, which count toward the memory
    # limit.
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777,size=${OPENBOT_TMP:-8g}
      - /var/tmp:exec,mode=1777,size=1g
      - /run/lock:mode=1777,size=1m
      # XDG_RUNTIME_DIR: the control socket, D-Bus and the keyring. Main refuses it unless the image
      # user owns it with mode 0700.
      - /run/openbot:mode=0700,uid=1000,gid=1000,size=64m
    # The file system of the instance, with its disk limit. OpenBot only connects out, so the
    # instances publish no port.
    volumes:
      - /srv/openbot/${OPENBOT_NAME:?}/data:/data
    # The network of all instances. They cannot reach each other, and openbot-firewall lets them
    # reach only the internet.
    networks:
      - openbot
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

networks:
  openbot:
    external: true
